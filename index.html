<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>UK/EU Fuel cost calculator</title>
  <link rel="stylesheet" href="./style.css">

<meta name="viewport" content="width=device-width">
</head>
<body>
	<form>
		<p>UK/EU Travel fuel Calculator</p>
		<h3>Distance travelled</h3>
		<input type="checkbox" class="checkbox" id="locktravelled"/>
		<input type="number" id="distanceMiles" step="0.1"><label> miles</label>
		<input type="number" id="distanceKM" step="0.1"><label> km</label>
		<label> ⨉ </label><input type="number" id="journeys" value="1">

		<h3>Fuel consumption</h3>
		<input type="checkbox" class="checkbox" id="lockconsumption"/>
		<input type="number" id="mpg"><label> MPG</label>
		<input type="number" id="kml" step="0.1"><label> km/L</label>
		<input type="number" id="l100" step="0.1"><label> L/100km</label>

		<h3>Fuel consumed</h3>
		<input type="checkbox" class="checkbox" id="lockconsumed"/>
		<input type="number" id="galsConsumed" step="0.1"><label> UK Gallons</label>
		<input type="number" id="ltrsConsumed" step="0.1"><label> Litres</label>

		<h3>Price per Litre</h3>
		<input type="number" id="priceLtr" value = "177">
		<label>			
			<select name="currency" id="currency">
				<option value="£">(£)p</option>
				<option value="€">(€)c</option>
			</select>
		</label>

		<h3>Journey Cost</h3>
		<label id="currencyLabel">£</label> <input type="number" id="journeyCost" step="0.01" readonly>
	</form>

<script  src="./script.js"></script>
</body>
</html>
